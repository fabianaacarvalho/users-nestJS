services:
  postgres:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tutorial
    logging:
      options:
        max-size: 10m
        max-file: '3'
    ports:
      - '5432:5432'
